[package]
name = "ragrig"
version = "0.9.5"
edition = "2024"
description = "RAG framework for research and prototyping. Zero dependencies, hot-swap any agent at runtime, hybrid BM25+vector retrieval. Default build compiles with cargo build --release and nothing else."
license = "MIT"
repository = "https://github.com/schmettow/ragrig"
readme = "README.md"
documentation = "https://docs.rs/ragrig"
exclude = [
    ".agents/",
    ".cargo/",
    "prompts/",
    "tests/fixtures/formats/*/.ragrig*",
]
keywords = ["rag", "llm", "embeddings", "retrieval", "ollama"]
categories = ["science", "text-processing", "asynchronous"]

[features]
default = ["internal", "ollama-embed"]
internal = ["rmp-serde"]
ollama-embed = []
internal-embed = ["dep:fastembed"]
internal-generate = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
]
internal-generate-cuda = [
    "internal-generate",
    "candle-core/cuda",
    "candle-transformers/cuda",
]
internal-generate-metal = [
    "internal-generate",
    "candle-core/metal",
    "candle-transformers/metal",
]
internal-generate-mkl = [
    "internal-generate",
    "candle-core/mkl",
    "candle-transformers/mkl",
]
offline = ["internal", "internal-embed", "internal-generate"]
offline-cuda = ["offline", "internal-generate-cuda"]
offline-metal = ["offline", "internal-generate-metal"]
offline-mkl = ["offline", "internal-generate-mkl"]
lancedb = [
    "dep:futures-util",
    "dep:lancedb",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:lance-index",
]
test-fixtures = ["dep:include_dir", "dep:tempfile"]
kreuzberg = ["dep:kreuzberg"]
all = [
    "internal",
    "ollama-embed",
    "internal-embed",
    "internal-generate",
    "lancedb",
    "test-fixtures",
    "kreuzberg",
]

[dependencies]
# ── Core / framework ──────────────────────────────────────────────────────
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
futures-util = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── RAG pipeline ──────────────────────────────────────────────────────────
rig-core = "0.39"
chunkedrs = "1.0"
rmp-serde = { version = "1", optional = true }

# ── Document parsers ──────────────────────────────────────────────────────
walkdir = "2"
pdf-extract = "0.12"
pdfsink-rs = "0.2"
unpdf = "0.7"
hayro = "0.7"
epub-parser = "0.3.4"
zip = "7.0"
roxmltree = "0.21"
kreuzberg = { version = "5.0.0-rc.35", default-features = false, features = [
    "pdf",
    "tokio-runtime",
], optional = true }

# ── Vector store backends ─────────────────────────────────────────────────
lancedb = { version = "0.31", optional = true }
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
lance-index = { version = "8", optional = true }

# ── Local inference ───────────────────────────────────────────────────────
fastembed = { version = "5", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }
candle-core = { version = "0.10", optional = true }
candle-transformers = { version = "0.10", optional = true }
tokenizers = { version = "0.23", optional = true }

# ── REPL / networking ─────────────────────────────────────────────────────
rustyline = "18.0"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }

# ── Dev / test fixtures ───────────────────────────────────────────────────
include_dir = { version = "0.7", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
