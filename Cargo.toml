[package]
name = "ragrig"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "RAG framework for research and prototyping. Zero dependencies, hot-swap any agent at runtime, hybrid BM25+vector retrieval. Default build compiles with cargo build --release and nothing else."
license = "MIT"
repository = "https://github.com/schmettow/ragrig"
readme = "README.md"
documentation = "https://docs.rs/ragrig"
exclude = [
    ".agents/",
    ".cargo/",
    "prompts/",
    "tests/fixtures/formats/*/.ragrig*",
    # Untracked source/binary assets — keep the crate tarball lean.
    "docs/assets/ragrig_logo.xcf",
    "docs/assets/raven-with-plumicorns.webp",
]
keywords = ["rag", "llm", "embeddings", "retrieval", "ollama"]
categories = ["science", "text-processing", "asynchronous"]

# docs.rs builds with default features only; enable the feature-gated
# chunker backends so TextSplitterChunker and CognigraphChunker appear
# in the published documentation.
[package.metadata.docs.rs]
features = ["chunker-textsplitter", "chunker-cognigraph", "vision-pdf"]

[features]
default = ["internal", "ollama-embed"]
internal = ["rmp-serde"]
ollama-embed = []
internal-embed = ["dep:fastembed"]
internal-generate = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# NOTE: the platform/toolchain-specific variants below (CUDA toolkit, macOS
# Metal, Intel MKL) can never be enabled simultaneously.  `cargo check
# --all-features` enables ALL of them at once and therefore fails (e.g.
# objc2/metal compile errors on Linux) — use the `all` feature instead,
# which covers every portable backend.
internal-generate-cuda = [
    "internal-generate",
    "candle-core/cuda",
    "candle-transformers/cuda",
]
internal-generate-metal = [
    "internal-generate",
    "candle-core/metal",
    "candle-transformers/metal",
]
internal-generate-mkl = [
    "internal-generate",
    "candle-core/mkl",
    "candle-transformers/mkl",
]
offline = ["internal", "internal-embed", "internal-generate"]
offline-cuda = ["offline", "internal-generate-cuda"]
offline-metal = ["offline", "internal-generate-metal"]
offline-mkl = ["offline", "internal-generate-mkl"]
lancedb = [
    "dep:futures-util",
    "dep:lancedb",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:lance-index",
]
test-fixtures = ["dep:include_dir", "dep:tempfile"]
kreuzberg = ["dep:kreuzberg"]
# Vision-VLM PDF parser — rasterises pages with hayro and extracts text via
# an Ollama vision model.  Off by default: hayro's rendering stack needs
# Rust 1.92 and adds significant compile time.
vision-pdf = ["dep:hayro"]
# Chunker backends.  The trait + built-in chunkers are always available;
# these flags add third-party algorithm libraries behind `Chunker` impls.
chunker-textsplitter = ["dep:text-splitter"]
chunker-cognigraph = ["dep:cognigraph-chunker"]
all = [
    "internal",
    "ollama-embed",
    "internal-embed",
    "internal-generate",
    "lancedb",
    "test-fixtures",
    "kreuzberg",
    "vision-pdf",
    "chunker-textsplitter",
    "chunker-cognigraph",
]

[dependencies]
# ── Core / framework ──────────────────────────────────────────────────────
anyhow = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
dyn-clone = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
urlencoding = "2"
base64 = "0.23.1"
sha2 = "0.11"
futures-core = "0.3"
futures-util = { version = "0.3", optional = true }
log = "0.4"
tracing = "0.1"

# ── RAG pipeline ──────────────────────────────────────────────────────────
rig-core = "0.42"
# 2.x adds markdown section ancestry, code/HTML modes, and late-chunking
# token spans.  `default-features = false` keeps only the o200k_base
# tokenizer vocabulary (the 1.x behaviour) instead of all 17 vocabularies.
# Vendored fork: two overlap fixes in the recursive splitter (see
# vendor/chunkedrs/Cargo.toml) — upstream chunkedrs 2.1.1 loses the
# overlap carry-over at some chunk boundaries.
chunkedrs = { path = "vendor/chunkedrs", default-features = false }
rmp-serde = { version = "1", optional = true }

# ── Chunker backends (optional; see feature flags) ─────────────────────────
text-splitter = { version = "0.32", features = ["markdown"], optional = true }
cognigraph-chunker = { version = "2", optional = true }

# ── Document parsers ──────────────────────────────────────────────────────
walkdir = "2"
pdf-extract = "0.12"
pdfsink-rs = "0.2"
unpdf = "0.14.0"
hayro = { version = "0.7", optional = true }
epub-parser = "0.3.4"
zip = "8"
roxmltree = "0.21"
kreuzberg = { version = "4", default-features = false, features = [
    "pdf",
    "tokio-runtime",
], optional = true }

# ── Vector store backends ─────────────────────────────────────────────────
lancedb = { version = "0.37", optional = true }
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
lance-index = { version = "10", optional = true }

# ── Local inference ───────────────────────────────────────────────────────
fastembed = { version = "6", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }
candle-core = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", optional = true }

# ── Networking ─────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }

# ── Dev / test fixtures ───────────────────────────────────────────────────
include_dir = { version = "0.7", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
http = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
