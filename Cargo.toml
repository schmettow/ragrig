[package]
name = "ragrig"
version = "1.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "RAG framework for research and prototyping: plug in Ollama, OpenAI, Claude, Mistral, or OpenRouter, hot-swap agents at runtime, and search with hybrid BM25+vector retrieval. Default build needs only cargo."
license = "MIT"
repository = "https://github.com/schmettow/ragrig"
readme = "README.md"
documentation = "https://docs.rs/ragrig"
exclude = [
    ".agents/",
    ".cargo/",
    "prompts/",
    "tests/fixtures/formats/*/.ragrig*",
    # Untracked source/binary assets — keep the crate tarball lean.
    "docs/assets/ragrig_logo.xcf",
    "docs/assets/raven-with-plumicorns.webp",
    # Repo-local working notes, not part of the release.
    "ANALYSIS_TODO.md",
    "API_FREEZE_CHECKLIST.md",
    "migrate_v097_098.md",
    "todo_v098.txt",
]
keywords = ["rag", "llm", "embeddings", "retrieval", "openai"]
categories = ["science", "text-processing", "asynchronous"]

# docs.rs builds with default features only; enable the feature-gated
# chunker backends so TextSplitterChunker appears in the published
# documentation.  `chunker-cognigraph` is omitted until upstream
# `cognigraph-chunker` supports `ort` 2.0.0-rc.15 (see below).
[package.metadata.docs.rs]
features = ["chunker-textsplitter", "vision-pdf"]

[features]
default = ["internal", "ollama-embed"]
internal = ["rmp-serde"]
ollama-embed = []
internal-embed = ["dep:fastembed"]
internal-generate = [
    "dep:candle-core",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# NOTE: the platform/toolchain-specific variants below (CUDA toolkit, macOS
# Metal, Intel MKL) can never be enabled simultaneously.  `cargo check
# --all-features` enables ALL of them at once and therefore fails (e.g.
# objc2/metal compile errors on Linux) — use the `all` feature instead,
# which covers every portable backend.
internal-generate-cuda = [
    "internal-generate",
    "candle-core/cuda",
    "candle-transformers/cuda",
]
internal-generate-metal = [
    "internal-generate",
    "candle-core/metal",
    "candle-transformers/metal",
]
internal-generate-mkl = [
    "internal-generate",
    "candle-core/mkl",
    "candle-transformers/mkl",
]
offline = ["internal", "internal-embed", "internal-generate"]
offline-cuda = ["offline", "internal-generate-cuda"]
offline-metal = ["offline", "internal-generate-metal"]
offline-mkl = ["offline", "internal-generate-mkl"]
lancedb = ["dep:futures-util", "dep:lancedb"]
test-fixtures = ["dep:include_dir", "dep:tempfile"]
kreuzberg = ["dep:kreuzberg"]
# Vision-VLM PDF parser — rasterises pages with hayro and extracts text via
# an Ollama vision model.  Off by default: hayro's rendering stack needs
# Rust 1.92 and adds significant compile time.
vision-pdf = ["dep:hayro"]
# EPUB parser (epub-parser crate).  Off by default: epub-parser 0.3.4 pins
# `zip = "^2.1"`, and the zip project yanked every release below 9.0.3 on
# 2026-10-16 (extraction advisories GHSA-4v9h-p7m9-rh26, GHSA-4684-h2q9-2vcp,
# GHSA-vv5m-jxxh-4627) — a mandatory dependency on that requirement breaks
# *fresh* resolutions (`cargo install` of ragrig or a dependent fails to
# select a `zip` version).  Local builds resolve from the lockfile, which
# still pins the yanked zip 2.4.2.  Move into `all` once epub-parser ships a
# zip 9 release.
epub = ["dep:epub-parser"]
# Chunker backends.  The trait + built-in chunkers are always available;
# these flags add third-party algorithm libraries behind `Chunker` impls.
chunker-textsplitter = ["dep:text-splitter"]
# Temporarily unbuildable: cognigraph-chunker 2.2.4 (latest) compiles
# against `ort 2.0.0-rc.11`, while fastembed 7.5 pins `ort =2.0.0-rc.15`;
# Cargo unifies on rc.15, whose `Session::builder` gained an `&Environment`
# argument.  The feature is kept so downstream users can opt in as soon as
# upstream catches up, but it is excluded from `all` until then.
chunker-cognigraph = ["dep:cognigraph-chunker"]
all = [
    "internal",
    "ollama-embed",
    "internal-embed",
    "internal-generate",
    "lancedb",
    "test-fixtures",
    "kreuzberg",
    "vision-pdf",
    "chunker-textsplitter",
]

[dependencies]
# ── Core / framework ──────────────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"
dyn-clone = "1.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
urlencoding = "2.1.3"
base64 = "0.23.1"
sha2 = "0.11.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", optional = true }
log = "0.4.34"
tracing = "0.1.44"

# ── RAG pipeline ──────────────────────────────────────────────────────────
rig-core = { version = "0.45", features = ["reqwest"] }
rig-reqwest = "0.45.0"
# 2.x adds markdown section ancestry, code/HTML modes, and late-chunking
# token spans.  `default-features = false` keeps only the o200k_base
# tokenizer vocabulary (the 1.x behaviour) instead of all 17 vocabularies.
# Known upstream limitation: at very small chunk sizes the overlap
# carry-over can be lost at some chunk boundaries (see the ignored
# regression test in src/chunker.rs).
chunkedrs = { version = "2.1.1", default-features = false }
rmp-serde = { version = "1.3.1", optional = true }

# ── Chunker backends (optional; see feature flags) ─────────────────────────
text-splitter = { version = "0.33.0", features = ["markdown"], optional = true }
cognigraph-chunker = { version = "2.2.4", optional = true }

# ── Document parsers ──────────────────────────────────────────────────────
walkdir = "2.5.0"
pdf-extract = "0.12.1"
pdfsink-rs = "0.2.20"
unpdf = "0.49.0"
hayro = { version = "0.8.0", optional = true }
epub-parser = { version = "0.3.4", optional = true }
zip = "9.0.5"
roxmltree = "0.21.2"
kreuzberg = { version = "4.10.4", default-features = false, features = [
    "pdf",
    "tokio-runtime",
], optional = true }

# ── Vector store backends ─────────────────────────────────────────────────
lancedb = { version = "0.40.0", features = ["remote"], optional = true }

# ── Local inference ───────────────────────────────────────────────────────
fastembed = { version = "7.5.0", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
], optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
tokenizers = { version = "0.23.2", optional = true }

# ── Networking ─────────────────────────────────────────────────────
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "json",
] }

# ── Dev / test fixtures ───────────────────────────────────────────────────
include_dir = { version = "0.7.4", optional = true }
tempfile = { version = "3.27.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
http = "1.5.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"
